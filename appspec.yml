version: 0.0
os: linux

files:
  - source: /
    destination: /opt/my-app
file_exists_behavior: OVERWRITE

hooks:
  ApplicationStop:
    - location: scripts/stop_container.sh
      timeout: 120
      runas: root
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 120
      runas: root
  ApplicationStart:
    - location: scripts/start_container.sh
      timeout: 300
      runas: root
  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 120
      runas: root
