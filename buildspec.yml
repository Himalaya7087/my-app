version: 0.2

env:
  variables:
    AWS_REGION: ap-south-1      # change to your region
    REPO_NAME: my-app           # your ECR repository name
    FRONTEND_BUCKET: my-app-frontend-dev-205429787317   # S3 bucket hosting the static frontend
    API_URL: http://13.203.158.72                        # backend (EC2) URL the frontend calls

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REGISTRY=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - ECR_URI=$REGISTRY/$REPO_NAME
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-7)
      - IMAGE_TAG=${IMAGE_TAG:-latest}
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY

  build:
    commands:
      - echo "Building image $ECR_URI:$IMAGE_TAG"
      - docker build -t $ECR_URI:$IMAGE_TAG -t $ECR_URI:latest .

  post_build:
    commands:
      - echo "Pushing image to ECR..."
      - docker push $ECR_URI:$IMAGE_TAG
      - docker push $ECR_URI:latest
      - echo "Writing image details for CodeDeploy..."
      - echo "IMAGE_URI=$ECR_URI:$IMAGE_TAG" > scripts/image.env
      - echo "IMAGE_TAG=$IMAGE_TAG" >> scripts/image.env
      - echo "AWS_REGION=$AWS_REGION" >> scripts/image.env
      - echo "REGISTRY=$REGISTRY" >> scripts/image.env
      - cat scripts/image.env
      - echo "Deploying frontend to s3://$FRONTEND_BUCKET..."
      - echo "window.APP_CONFIG = { API_URL:\"$API_URL\", FRONTEND_VERSION:\"$IMAGE_TAG\" };" > frontend/config.js
      - aws s3 sync frontend/ s3://$FRONTEND_BUCKET/ --delete --exclude "*.html" --exclude "config.js" --cache-control "max-age=300"
      - aws s3 cp frontend/ s3://$FRONTEND_BUCKET/ --recursive --exclude "*" --include "*.html" --include "config.js" --cache-control "no-cache"

artifacts:
  files:
    - appspec.yml
    - scripts/**/*
